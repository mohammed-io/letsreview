<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>letsreview</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="content">
        <header class="topbar">
          <div class="brand">
            <span class="mark">lr</span>
            <div>
              <h1>letsreview</h1>
              <p id="repo-label">local repo</p>
            </div>
          </div>
          <div class="review-title">
            <h2 id="session-title">No review loaded</h2>
            <p id="session-summary">Create a review to inspect diffs.</p>
          </div>
          <div class="mode-toggle">
            <button id="mode-live" class="mode-btn active">Live</button>
            <button id="mode-sessions" class="mode-btn">Sessions</button>
          </div>
          <section class="comparison" id="comparison-panel">
            <label>
              Diff Type
              <select id="mode">
                <option value="working">Working tree vs HEAD</option>
                <option value="staged">Staged changes</option>
                <option value="refs">Two refs</option>
              </select>
            </label>
            <div class="refs" id="refs">
              <label>
                Base
                <input id="base-ref" placeholder="main">
              </label>
              <label>
                Head
                <input id="head-ref" placeholder="feature-branch">
              </label>
            </div>
            <button id="create-session">Create review</button>
          </section>
          <section class="sessions-popover" id="sessions-panel">
            <div id="sessions" class="sessions"></div>
          </section>
          <div class="stats">
            <span id="stat-files">0 files</span>
            <span id="stat-add">+0</span>
            <span id="stat-del">-0</span>
          </div>
        </header>

        <div class="workspace">
          <nav class="files" id="files"></nav>
          <section class="diff-area">
            <div class="diff-toolbar">
              <span id="active-file">No file selected</span>
              <div class="diff-actions">
                <span id="review-status" class="review-submitted" style="display:none">Review submitted</span>
                <label class="viewed-toggle">
                  <input id="viewed-file" type="checkbox">
                  Viewed
                </label>
                <button id="explain-selection" class="secondary">Explain selection</button>
                <button id="show-file-comments" class="secondary">Comments</button>
                <button id="submit-review" class="secondary">Submit review</button>
                <button id="clear-session" class="secondary danger">Clear session</button>
              </div>
            </div>
            <div class="diff-stage">
              <canvas id="diff-canvas" width="1200" height="720"></canvas>
              <section class="inline-review" id="inline-review" aria-label="Review feedback">
                <div class="inline-review-header">
                  <strong id="inline-review-title">Add review comment</strong>
                  <button id="close-feedback" class="secondary" aria-label="Close feedback">Close</button>
                </div>
                <p id="explanation">Select diff rows, then ask for an explanation.</p>
                <div class="comment-list" id="comment-list"></div>
                <textarea id="feedback" placeholder="Leave a comment"></textarea>
                <div class="inline-review-actions">
                  <button id="save-feedback">Save feedback <kbd class="shortcut"></kbd></button>
                </div>
              </section>
            </div>
          </section>
          <section class="modal" id="comments-modal" aria-label="File comments">
            <div class="modal-dialog">
              <div class="modal-header">
                <strong>File comments</strong>
                <button id="close-comments-modal" class="secondary">Close</button>
              </div>
              <div class="comment-list" id="file-comment-list"></div>
            </div>
          </section>
          <section class="modal" id="agent-payload-modal" aria-label="Agent payload">
            <div class="modal-dialog">
              <div class="modal-header">
                <strong>Agent payload</strong>
                <button id="close-agent-payload" class="secondary">Close</button>
              </div>
              <pre id="agent-payload"></pre>
            </div>
          </section>
        </div>
      </section>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
